<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0a0a0f"/>
  <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#grad)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="bold" font-size="240" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">7</text>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
